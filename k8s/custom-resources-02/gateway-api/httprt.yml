apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: citadel-httproute
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: citadel-gateway
      namespace: podinfo
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: citadel-gateway-svc
          namespace: podinfo
          port: 9898
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
