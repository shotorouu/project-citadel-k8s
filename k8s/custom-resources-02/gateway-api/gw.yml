apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: citadel-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  gatewayClassName: citadel-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
